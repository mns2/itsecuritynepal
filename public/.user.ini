; PHP settings for cPanel (PHP-FPM / LiteSpeed read .user.ini from the document root).
; If the host uses cPanel → MultiPHP INI Editor instead, set the same values there.
; Access to this file over the web is blocked by .htaccess.

; Admin photo uploads allow 4 MB images
upload_max_filesize = 8M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60

; Never show errors to visitors (Laravel logs them to storage/logs)
display_errors = Off
display_startup_errors = Off
log_errors = On

; Session cookies (Laravel manages its own, these cover plain PHP)
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"

; Do not let PHP open remote URLs as files
allow_url_include = Off
